[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Giovanni Pecelli", email = "imgiovannipecelli@protonmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fire>=0.7.1",
    "pydantic>=2.14.1",
    "tqdm>=4.70.1",
    "torch>=2.14.1",
    "transformers>=5.20.2",
    "accelerate>=1.15.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.1",
]

[tool.mypy]
exclude = '(^|/)(data|\.venv)/'
ignore_missing_imports = true
